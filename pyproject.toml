[project]
name = "jevol"
version = "0.1.0"
description = "Stellar Rotational Evolution Simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib",
    "nox",
    "ruff",
]
doc = [
    "uvicorn",
    "markdown",
]

[project.scripts]
jevol = "Python.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Python"]

[tool.pytest.ini_options]
testpaths = ["Python/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
